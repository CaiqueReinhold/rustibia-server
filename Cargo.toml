[workspace]
resolver = "3"
members = ["crates/certgen", "crates/contract", "crates/loadtest", "crates/server", "crates/site"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "json", "time"] }
thiserror = "2"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
rand = "0.10"
serde_yaml = "0.9"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3.32"
wiremock = "0.6"
