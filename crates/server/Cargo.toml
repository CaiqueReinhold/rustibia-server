[package]
name = "rustibia-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
rustibia-contract = { path = "../contract" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

arc-swap = "1"
futures = "0.3.32"
once_cell = "1.21.4"
pathfinding = "4"
rand = "0.10"
rstar = "0.12" # Spatial indexing
serde_yaml = "0.9"
slotmap = "1.1.1"
smallvec = "1.15.1"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7", features = ["codec"] }
rand_distr = "0.6.0"
strum = { version = "0.28.0", features = ["derive"] }
imbl = "7.0.2"

[dev-dependencies]
rustibia-certgen = { path = "../certgen" }
wiremock = "0.6"
