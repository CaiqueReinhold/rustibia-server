name: Appaloosa
position: { x: 32852, y: 32124, z: 7 }
speed: 100
outfit:
  id: 140
  colors: [114, 0, 114, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATION: { x: 32449, y: 32226, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Salutations, {{ PLAYERNAME | capitalize }} I guess you are here for the horses.
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["transport"]
    action: say
    text: We can bring you to Thais with one of our coaches for 125 gold. Are you interested?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "125"
          position: DESTINATION
      - words: ["no"]
        action: say
        reset: true
        text: Then not.
