  chance: 0
arguments:
  QUARTERS:
    magician: { x: 32885, y: 31157, z: 7 }
    sunken: { x: 32884, y: 31162, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["pass"]
    action: say
    text: You can pass either to the Magician Quarter or Sunken Quarter. Which one will it be?
    children:
      - words: ["magician", "sunken"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: QUARTERS[WORD]
