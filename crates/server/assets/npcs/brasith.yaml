  - words: ["deraisim"]
    action: say
    text: "We have still much to learn but we are on the correct path at least."
  - words: ["cenath"]
    action: say
    text: "The Cenath forgot as many as they learned. I doubt they find the wisdom they are looking for without the things they neglected in their pursuit of knowledge."
  - words: ["troll"]
    action: say
    text: "I don't claim to understand this creatures but sometimes they are more close to the roots than we are."
  - words: ["human"]
    action: say
    text: "They are so many, so planless, so divided. They choose a path I do not want for my own race."
  - words: ["plants"]
    action: say
    text: "Life takes many forms. Plants are a very basic form of life. Its simplicity makes them close to the core of nature."
