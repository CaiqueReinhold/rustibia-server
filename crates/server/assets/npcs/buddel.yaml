keywords:
  - words: GREET
    action: engage
    text: "Hey big guys. You? Here? *HICKS*"
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["okolnir"]
    condition: has_item(RING)
    action: say
    text: Ohh, you got a nice ring there! Ya don't have to pay if you gimme the ring and I promise you I will bring you to the correct spot!*HICKS* Alright?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          item: RING
          position: DESTINATIONS["okolnir"]
      - words: ["no"]
        action: say
        text: Give me 50 gold and I bring you to okolnir. 'kay?
        children:
          - words: ["no"]
            action: say
            reset: true
            text: You shouldn't miss the experience.
          - words: ["yes"]
            action: teleport
            failed_text: You don't have enough money.
            params:
              cost: "50"
              position: DESTINATIONS["okolnir"] if uniform(1, 5) > 1 else ASTRAY[uniform(0, 3)]
