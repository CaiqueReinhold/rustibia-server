    - { x: 32020, y: 31297, z: 7 }
    - { x: 32021, y: 31297, z: 7 }
    - { x: 32022, y: 31297, z: 7 }
shop:
  - { id: 10302, sell: 45 }
keywords:
  - words: GREET
    action: engage
    text: "Where are we at the moment? Is this Svargrond? NO,*HICKS* it's Camp! Anyway, where do you want to go?"
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["svargrond"]
    condition: has_item(RING)
    action: say
    text: Ohh, you got a nice ring there! Ya don't have to pay if you gimme the ring and I promise you I will bring you to the correct spot!*HICKS* Alright?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          item: RING
          position: DESTINATIONS["svargrond"]
      - words: ["no"]
        action: say
        text: Give me 50 gold and I bring you to svargrond. 'kay?
        children:
          - words: ["no"]
            action: say
            reset: true
            text: You shouldn't miss the experience.
          - words: ["yes"]
            action: teleport
            failed_text: You don't have enough money.
            params:
              cost: "50"
              position: DESTINATIONS["svargrond"] if uniform(1, 5) > 1 else ASTRAY[uniform(0, 3)]
