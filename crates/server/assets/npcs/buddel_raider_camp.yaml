    svargrond: { x: 32255, y: 31197, z: 7 }
    okolnir: { x: 32225, y: 31381, z: 7 }
    helheim: { x: 32462, y: 31174, z: 7 }
    tyrsung: { x: 32333, y: 31227, z: 7 }
