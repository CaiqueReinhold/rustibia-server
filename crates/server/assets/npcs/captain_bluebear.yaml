name: Captain Bluebear
position: { x: 32310, y: 32209, z: 6 }
speed: 100
outfit:
  id: 129
  colors: [19, 69, 125, 50]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Passages to Carlin, Ab'Dendriel, Edron, Venore, Port Hope, Liberty Bay, Yalahar, Roshamuul, Krailos, Oramond and Svargrond.
arguments:
  DESTINATIONS:
    carlin: { name: Carlin, cost: 110, position: { x: 32387, y: 31820, z: 6 } }
    ab'dendriel: { name: Ab'Dendriel, cost: 130, position: { x: 32734, y: 31668, z: 6 } }
    edron: { name: Edron, cost: 160, position: { x: 33175, y: 31764, z: 6 } }
    venore: { name: Venore, cost: 170, position: { x: 32954, y: 32022, z: 6 } }
    port hope: { name: Port Hope, cost: 160, position: { x: 32527, y: 32784, z: 6 } }
    roshamuul: { name: Roshamuul, cost: 210, position: { x: 33494, y: 32567, z: 7 } }
    svargrond: { name: Svargrond, cost: 180, position: { x: 32341, y: 31108, z: 6 } }
    liberty bay: { name: Liberty Bay, cost: 180, position: { x: 32285, y: 32892, z: 6 } }
    yalahar: { name: Yalahar, cost: 200, position: { x: 32816, y: 31272, z: 6 } }
    oramond: { name: Oramond, cost: 150, position: { x: 33479, y: 31985, z: 7 } }
    krailos: { name: Krailos, cost: 230, position: { x: 33492, y: 31712, z: 6 } }
  KICK:
    - { x: 32320, y: 32219, z: 6 }
    - { x: 32321, y: 32210, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["carlin", "ab'dendriel", "edron", "venore", "port hope", "roshamuul", "svargrond", "liberty bay", "yalahar", "oramond", "krailos"]
    action: say
    text: Do you seek a passage to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 1)]
  - words: ["name"]
    action: say
    text: My name is Captain Bluebear from the Royal Tibia Line.
  - words: ["job", "captain"]
    action: say
    text: I am the captain of this sailing-ship.
  - words: ["ship", "line", "company", "tibia"]
    action: say
    text: The Royal Tibia Line connects all seaside towns of Tibia.
  - words: ["good"]
    action: say
    text: We can transport everything you want.
  - words: ["passenger"]
    action: say
    text: We would like to welcome you on board.
  - words: ["trip", "route", "passage", "town", "destination", "sail", "go"]
    action: say
    text: Where do you want to go? To Carlin, Ab'Dendriel, Venore, Port Hope, Liberty Bay, Svargrond, Yalahar, Roshamuul, Oramond or Edron?
  - words: ["ice", "senja", "folda", "vega"]
    action: say
    text: I'm sorry, but we don't serve the routes to the Ice Islands.
  - words: ["darashia", "darama"]
    action: say
    text: I'm not sailing there. This route is afflicted by a ghostship! However I've heard that Captain Fearless from Venore sails there.
  - words: ["ghost"]
    action: say
    text: Many people who sailed to Darashia never returned because they were attacked by a ghostship! I'll never sail there!
  - words: ["thais"]
    action: say
    text: This is Thais. Where do you want to go?
  - words: ["inquisition"]
    action: say
    text: A direct edict from the honorable Henricus orders me to give passage to all potential recruits for a dangerous mission on an island to the north-east.
