name: Captain Cookie
position: { x: 32804, y: 31277, z: 6 }
speed: 100
outfit:
  id: 96
  colors: [0, 0, 0, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  LIBERTY_BAY: { x: 32285, y: 32892, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, daring adventurer. If you need a passage, let me know.
  - words: GOODBYE
    action: dismiss
    text: Good bye.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["liberty bay", "passage"]
    action: say
    text: I can bring you to our base in Liberty Bay for 400 gold. Is that what you want?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "400"
          position: LIBERTY_BAY
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["sail"]
    action: say
    text: I can take you to Liberty Bay.
  - words: ["job", "captain"]
    action: say
    text: I am the captain of this ship.
  - words: ["yalahar"]
    action: say
    text: I travelled here, hoping to find the cockaigne. Imagine my disappointment when I discovered I was wrong.
