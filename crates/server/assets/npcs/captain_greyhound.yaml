name: Captain Greyhound
position: { x: 32387, y: 31822, z: 6 }
speed: 100
outfit:
  id: 129
  colors: [96, 113, 95, 115]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATIONS:
    thais: { name: Thais, cost: 110, position: { x: 32310, y: 32210, z: 6 } }
    ab'dendriel: { name: Ab'Dendriel, cost: 80, position: { x: 32734, y: 31668, z: 6 } }
    edron: { name: Edron, cost: 110, position: { x: 33175, y: 31764, z: 6 } }
    venore: { name: Venore, cost: 130, position: { x: 32954, y: 32022, z: 6 } }
    svargrond: { name: Svargrond, cost: 110, position: { x: 32341, y: 31108, z: 6 } }
    yalahar: { name: Yalahar, cost: 185, position: { x: 32816, y: 31272, z: 6 } }
  KICK:
    - { x: 32384, y: 31815, z: 6 }
    - { x: 32387, y: 31815, z: 6 }
    - { x: 32390, y: 31815, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["thais", "ab'dendriel", "edron", "venore", "svargrond", "yalahar"]
    action: say
    text: Do you seek a passage to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 2)]
  - words: ["name"]
    action: say
    text: My name is Captain Greyhound from the Royal Tibia Line.
  - words: ["job", "captain"]
    action: say
    text: I am the captain of this sailing-ship.
  - words: ["ship", "line", "company", "route", "tibia"]
    action: say
    text: The Royal Tibia Line connects all seaside towns of Tibia.
  - words: ["good"]
    action: say
    text: We can transport everything you want.
  - words: ["passenger"]
    action: say
    text: We would like to welcome you on board.
  - words: ["trip", "passage", "town", "destination", "sail", "go"]
    action: say
    text: Where do you want to go? To Thais, Ab'Dendriel, Venore, Svargrond, Yalahar or Edron?
  - words: ["ice", "senja", "folda", "vega"]
    action: say
    text: I'm sorry, but we don't serve the routes to the Ice Islands.
  - words: ["darashia", "darama"]
    action: say
    text: I'm not sailing there. This route is afflicted by a ghost ship! However I've heard that Captain Fearless from Venore sails there.
  - words: ["ghost"]
    action: say
    text: Many people who sailed to Darashia never returned because they were attacked by a ghostship! I'll never sail there!
  - words: ["carlin"]
    action: say
    text: This is Carlin. Where do you want to go?
  - words: ["farmine", "kazordoon", "krailos", "liberty bay", "oramond", "ankrahmun", "port hope", "rathleton", "roshamuul", "tiquanda", "zao"]
    action: say
    text: Sorry, but I don't sail there.
