name: Captain Jack
position: { x: 32190, y: 31957, z: 6 }
speed: 100
outfit:
  id: 132
  colors: [0, 128, 95, 115]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  TIBIA: { x: 32204, y: 31756, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["tibia"]
    action: say
    text: Do you seek a passage back to Tibia?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: TIBIA
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["passage", "job"]
    action: say
    text: I can travel you to Tibia.
