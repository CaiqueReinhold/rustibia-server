name: Captain Max
position: { x: 32298, y: 32895, z: 6 }
speed: 100
outfit:
  id: 134
  colors: [95, 10, 56, 77]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Whoah. That was a large shadow passing by.
arguments:
  CALASSA: { x: 31911, y: 32710, z: 6 }
  YALAHAR: { x: 32804, y: 31270, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Ahoy, {{ PLAYERNAME | capitalize }}. On a mission for the explorer society, eh?
  - words: GOODBYE
    action: dismiss
    text: Good bye.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["calassa"]
    action: say
    text: Should I bring you to Calassa for 200 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "200"
          position: CALASSA
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
  - words: ["yalahar"]
    action: say
    text: That is quite a long unprofitable travel. I'll bring you to Yalahar for 400 gold though. Is that ok with you?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "400"
          position: YALAHAR
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
  - words: ["sail", "passage"]
    action: say
    text: Welcome on board, noble {{ PLAYERNAME | capitalize }}. I can bring you to Calassa or Yalahar, but only if you have the according mission from Berenice or Wyrdin.
  - words: ["job", "captain"]
    action: say
    text: I am the captain of this ship.
