name: Captain Sinbeard
position: { x: 33091, y: 32883, z: 6 }
speed: 100
outfit:
  id: 134
  colors: [95, 10, 56, 77]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATIONS:
    edron: { name: Edron, cost: 160, position: { x: 33175, y: 31764, z: 6 } }
    venore: { name: Venore, cost: 150, position: { x: 32954, y: 32022, z: 6 } }
    port hope: { name: Port Hope, cost: 80, position: { x: 32527, y: 32784, z: 6 } }
    liberty bay: { name: Liberty Bay, cost: 90, position: { x: 32285, y: 32892, z: 6 } }
    darashia: { name: Darashia, cost: 100, position: { x: 33289, y: 32480, z: 6 } }
    yalahar: { name: Yalahar, cost: 230, position: { x: 32816, y: 31272, z: 6 } }
  KICK:
    - { x: 33082, y: 32879, z: 6 }
    - { x: 33085, y: 32879, z: 6 }
    - { x: 33085, y: 32881, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, Sir {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["edron", "venore", "port hope", "liberty bay", "darashia", "yalahar"]
    action: say
    text: Do you seek a passage to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 2)]
  - words: ["name"]
    action: say
    text: I'm known all over the world as Captain Sinbeard
  - words: ["job", "captain"]
    action: say
    text: I'm the captain of this sailing ship
  - words: ["ship", "line", "company", "tibia"]
    action: say
    text: My ship is the fastest in the whole world.
  - words: ["passanger"]
    action: say
    text: We would like to welcome you on board.
  - words: ["god", "trip", "route", "passage", "town", "destination", "sail", "go"]
    action: say
    text: Where do you want to go? To Darashia, Venore, Liberty Bay, Port Hope, Yalahar or Edron? Or to Travora - the island between the worlds?
  - words: ["thais", "carlin", "ab'dendriel"]
    action: say
    text: I'm sorry but I don't sail there.
  - words: ["ankrahmun"]
    action: say
    text: That's where we are.
