name: Captain Waverider
position: { x: 32043, y: 32931, z: 7 }
speed: 100
outfit:
  id: 96
  colors: [0, 0, 0, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  MERIANA: { x: 32346, y: 32625, z: 7 }
  ISLAND: { x: 32131, y: 32913, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, daring adventurer. If you need a passage, let me know.
  - words: GOODBYE
    action: dismiss
    text: Good bye.
  - words: WALK_AWAY
    action: dismiss
    text: Oh well.
  - words: ["peg leg"]
    action: say
    text: Ohhhh. So... <lowers his voice> you know who sent you so I sail you to you know where. <wink> <wink> It will cost 50 gold to cover my expenses. Is it that what you wish?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "50"
          position: MERIANA
      - words: ["no"]
        action: say
        reset: true
        text: I have to admit this leaves me a bit puzzled.
  - words: ["passage"]
    action: say
    text: <sigh> I knew someone else would claim all the treasure someday. But at least it will be you and not some greedy and selfish person. For a small fee of 200 gold pieces I will sail you to your rendezvous with fate. Do we have a deal?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "200"
          position: ISLAND
      - words: ["no"]
        action: say
        reset: true
        text: I have to admit this leaves me a bit puzzled.
  - words: ["no"]
    action: say
    text: I have to admit this leaves me a bit puzzled.
