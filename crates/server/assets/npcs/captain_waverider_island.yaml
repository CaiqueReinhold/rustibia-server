name: Captain Waverider
position: { x: 32131, y: 32914, z: 7 }
speed: 100
outfit:
  id: 96
  colors: [0, 0, 0, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  LIBERTY_BAY: { x: 32349, y: 32856, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, daring adventurer. If you need a return passage, let me know.
  - words: GOODBYE
    action: dismiss
    text: Good bye.
  - words: WALK_AWAY
    action: dismiss
    text: Oh well.
  - words: ["liberty bay"]
    action: say
    text: Do you seek a passage back to Liberty Bay for 50 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "50"
          position: LIBERTY_BAY
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["passage"]
    action: say
    text: Where do you want to go? To Liberty bay?
  - words: ["job", "captain"]
    action: say
    text: I am the captain of this ship.
