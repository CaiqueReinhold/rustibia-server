keywords:
  - words: GREET
    action: engage
    text: "Welcome, young {{ PLAYERNAME | capitalize }}! If you are heavily wounded or poisoned, I can heal you for free."
  - words: GOODBYE
    action: dismiss
    text: "May the gods bless you, {{ PLAYERNAME | capitalize }}!"
  - words: WALK_AWAY
    action: dismiss
    text: "Remember: If you are heavily wounded or poisoned, I can heal you for free."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["adventurer stone"]
    action: say
    text: "Ah, you want to replace your adventurer's stone for 30 gold?"
  - words: ["heal"]
    action: say
    text: "You aren't looking that bad. Sorry, I can't help you. But if you are looking for additional protection you should go on the pilgrimage of ashes or get the protection of the twist of fate here."
  - words: ["pilgrimage"]
    action: say
    text: "Whenever you receive a lethal wound, your vital force is damaged and there is a chance that you lose some of your equipment. With every single of the five blessings you have, this damage and chance of loss will be reduced."
  - words: ["blessings"]
    action: say
    text: "There are five blessings available in five sacred places: the spiritual shielding, the spark of the phoenix, the embrace of Tibia, the fire of the suns and the wisdom of solitude. Additionally, you can receive the twist of fate here."
  - words: ["spiritual", "shield"]
    action: say
    text: "You can ask for the blessing of spiritual shielding in the whiteflower temple south of Thais."
  - words: ["embrace"]
    action: say
    text: "The druids north of Carlin will provide you with the embrace of Tibia."
  - words: ["suns", "fire"]
    action: say
    text: "You can ask for the blessing of the two suns in the suntower near Ab'Dendriel."
  - words: ["phoenix", "spark"]
    action: say
    text: "The spark of the phoenix is given by the dwarven priests of earth and fire in Kazordoon."
  - words: ["solitude", "wisdom"]
    action: say
    text: "Talk to the hermit Eremo on the isle of Cormaya about this blessing."
