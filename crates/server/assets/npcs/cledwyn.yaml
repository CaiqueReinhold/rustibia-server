keywords:
  - words: GREET
    action: engage
    text: "Blessings, Player! How may I be of service? Do you wish to trade some tokens, or would you like some information or talk? Should I enchant certain items for you?"
  - words: GOODBYE
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}."
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["cledwyn"]
    action: say
    text: "Named after my grandfather. He was a gifted jeweller. Lost in the field looking for rare stones, alas."
  - words: ["family"]
    action: say
    text: "You might find some O'Reilly in some other town, just like me. We're all vagabonds, really. <smiles winningly> Always on the move to trade precious tokens. ... There's a little family competition on who's the most successful token hunter, so if you should have any tokens with you, I'd be delighted to trade you some. <bows>"
  - words: ["name"]
    action: say
    text: "<bows> Cledwyn O'Reilly, bespoke smith and token trader, at your service."
  - words: ["city"]
    action: say
    text: "A most delightful place! You meet all sorts here. Some very pretty ladies, too. <winks> And I am looking forward to a good beer in the tavern after sunset."
  - words: ["yana"]
    action: say
    text: "You already met her? Yes, she's my cousin. She also collects rare tokens, but unlike me she's interested in gold tokens. Call this passion something of a family trait."
  - words: ["job"]
    action: say
    text: "Well, I'm a smith by trade, but my passion is to collect rare tokens made of metal or gemstones. It's something of a family trait. ... All of my family have a passion for some precious stone or metal, but as we're craftsmen, not warriors, we prefer to trade for what we want. ... At the moment, I'm rather interested in silver tokens. ... If you should happen to have any with you, I'll forge you a first-class armour in return for 100 of 'em."
