name: Dalbrect
position: { x: 32206, y: 31756, z: 6 }
speed: 100
outfit:
  id: 129
  colors: [76, 97, 67, 76]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  ISLE_OF_THE_KINGS: { x: 32190, y: 31957, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Be greeted, traveller {{ PLAYERNAME | capitalize }}. Welcome to my hut.
  - words: GOODBYE
    action: dismiss
    text: Good bye. You are welcome.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["passage"]
    action: say
    text: Do you seek a passage to the isle of the kings for 10 gold coins?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "10"
          position: ISLE_OF_THE_KINGS
      - words: ["no"]
        action: say
        reset: true
        text: Well, I'll be here if you change your mind.
  - words: ["name"]
    action: say
    text: My name is Dalbrect Windtrouser, of the once proud Windtrouser family.
  - words: ["hut"]
    action: say
    text: I am merely a humble fisher now that nothing is left of my noble legacy.
  - words: ["legacy"]
    action: say
    text: Once my family was once noble and wealthy, but fate turned against us and threw us into poverty.
  - words: ["poverty", "fate"]
    action: say
    text: When Carlin tried to colonize the region now known as the ghostlands, my ancestors put their fortune in that project.
  - words: ["ghostlands", "project"]
    action: say
    text: Our family fortune was lost when the colonization of those cursed lands failed. Now nothing is left of our fame or our fortune. If I only had something as a reminder of those better times. <sigh>
  - words: ["carlin"]
    action: say
    text: To think my family used to belong to the local nobility! And now those arrogant women are in charge!
  - words: ["need"]
    action: say
    text: There is little I can offer you but a trip with my boat. Are you looking for a passage to the isle of kings perhaps?
  - words: ["ship"]
    action: say
    text: My ship is my only pride and joy.
