name: Ferryman Kamil
position: { x: 32152, y: 32457, z: 7 }
speed: 100
outfit:
  id: 132
  colors: [0, 71, 76, 115]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATION: { x: 32088, y: 32470, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["meluna"]
    action: say
    text: You want me to transport you and your spouse to Honeymoon Island Meluna?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: DESTINATION
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
