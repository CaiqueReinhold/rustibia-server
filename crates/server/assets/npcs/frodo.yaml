name: "Frodo"
position: { x: 32358, y: 32209, z: 7 }
speed: 100
outfit:
  id: 128
  colors: [58, 68, 109, 115]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - "Come into my tavern and share some stories!"
shop:
  - { id: 3600, buy: 4 }
  - { id: 3607, buy: 6 }
  - { id: 3582, buy: 8 }
  - { id: 3577, buy: 5 }
keywords:
  - words: GREET
    action: engage
    text: "Welcome to Frodo's Hut. You heard about the news?"
  - words: GOODBYE
    action: dismiss
    text: "Please come back from time to time."
  - words: WALK_AWAY
    action: dismiss
    text: "Please come back from time to time."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["hut"]
    action: say
    text: "I hope you like it. Would you like some food?"
  - words: ["job", "saloon"]
    action: say
    text: "I am the owner of this saloon. I call it Frodo's Hut. I am also selling food."
  - words: ["food"]
    action: say
    text: "I can offer you bread, cheese, ham, or meat. If you'd like to see my offers, ask me for a trade."
  - words: ["news"]
    action: say
    text: "Some travelers from Edron told about a great treasure guarded by cruel demons in the dungeons there."
  - words: ["king", "tibianus"]
    action: say
    text: "Oh, our beloved king! Thanks to him, alcohol is so cheap."
  - words: ["general"]
    action: say
    text: "Harkath Bloodblade is the royal general."
  - words: ["army"]
    action: say
    text: "Hehe. Great customers."
  - words: ["name"]
    action: say
    text: "Just call me Frodo."
  - words: ["dungeons", "graveyard"]
    action: say
    text: "Ah yes, the graveyard dungeon. All I know is this riddle: His Grave to the south, the tree above, his soul in the shade. No idea what that means, though!"
  - words: ["riddle"]
    action: say
    text: "I heard it when I was a child."
  - words: ["one eyed stranger"]
    action: say
    text: "Yes, I remember him. His name was Berfasmur."
  - words: ["berfasmur"]
    action: say
    text: "Sorry, he spoke only very little. I know nothing more about him."
  - words: ["tibia"]
    action: say
    text: "Come on! You know that our world is called Tibia."
  - words: ["excalibug"]
    action: say
    text: "Nothing more than a tale for warriors."
  - words: ["ferumbras"]
    action: say
    text: "Uhm, do not mention him. It may scare customers away."
  - words: ["cropwell"]
    action: say
    text: "No idea who that is, but maybe you'll find something in the Royal Archives..."
  - words: ["royal archives"]
    action: say
    text: "Oh, the Royal Archives are in Rain Castle!"
  - words: ["rain castle"]
    action: say
    text: "The king's residence has been renovated lately."
  - words: ["carlin"]
    action: say
    text: "Many travellers tell funny stories about all the emancipated women in this northern town."
  - words: ["thais"]
    action: say
    text: "Here in Thais is the center of Tibia."
  - words: ["donald"]
    action: say
    text: "He is a little shy. In his youth he dreamed to become a druid."
  - words: ["baxter"]
    action: say
    text: "He's able to drink a bottle or two."
  - words: ["bozo"]
    action: say
    text: "I am trying to hire him for an evening or two."
  - words: ["eclesius"]
    action: say
    text: "Oh, that old guy! He's a good customer, that's for sure."
  - words: ["elane"]
    action: say
    text: "Can you believe that she actually told her guildfellows that alcohol is a bad thing?"
  - words: ["galuna"]
    action: say
    text: "She makes excellent arrows and bows."
  - words: ["gorn"]
    action: say
    text: "Many of his customers visit my Hut, too."
  - words: ["gregor"]
    action: say
    text: "The knights have sometimes parties here after some arena fights."
  - words: ["harkath bloodblade"]
    action: say
    text: "Too disciplined to enjoy life."
  - words: ["hugo"]
    action: say
    text: "I think some time ago a stranger from Fibula with that name stayed here for some nights."
  - words: ["lugri"]
    action: say
    text: "I overheard some conversations about his evilness. That's enough to hope, that I never ever meet him."
  - words: ["lungelen"]
    action: say
    text: "A sorceress, you can find her in their guild sitting befor a book - always!"
  - words: ["lynda"]
    action: say
    text: "Just between you and me: What a babe!"
  - words: ["marvik"]
    action: say
    text: "Marvik seldom leaves his guildhall at all."
  - words: ["mcronald", "sherry"]
    action: say
    text: "The McRonalds are a nice couple. Donald is a dear friend of mine."
  - words: ["muriel"]
    action: say
    text: "Muriel has never visited this place."
  - words: ["oswald"]
    action: say
    text: "I hate him. Each of his visits here ends with a bar brawl."
  - words: ["quentin"]
    action: say
    text: "He hardly visits my humble tavern."
  - words: ["samuel"]
    action: say
    text: "A loud neighbour, I get a lot of complaints about him."
  - words: ["todd"]
    action: say
    text: "That fellow is filthy rich. He rented a room upstairs for months in advance and always orders the best beer and wine i serve."
  - words: ["xodet"]
    action: say
    text: "I don't know where he gets these fluids. If I could sell them here, the hut would be crowded."
  - words: ["killed by cyclops"]
    action: say
    text: "That's horrible! I am in grief. I will never hear his songs again. I will even miss that strange rhyme he was obsessed with."
  - words: ["hengis wulfson"]
    action: say
    text: "He is a great bard. He often graced my hut with his presence, songs, and rhymes. I wonder what happened to him lately."
  - words: ["first dragon"]
    action: say
    text: "I think the tales about him are widely exaggerated."
  - words: ["sunset homes"]
    action: say
    text: "The sunset homes are a block of flats south of the harbour."
  - words: ["satanic"]
    action: say
    text: "Hmm, I have heard of a 'satanic influence' theory by someone called Newton or something like that... Maybe there's more in the Royal Archives."
  - words: ["special"]
    action: say
    text: "That would be my tavern of course... well and perhaps the royal satin that was created especially for the king but sometimes is bought by wealthy citizens as well."
  - words: ["formula"]
    action: say
    text: "A formula for a potion? No... he didn't talk to me about something like that."
  - words: ["killed"]
    action: say
    text: "Oh, by the gods! What do you say happened to him?"
  - words: ["potion"]
    action: say
    text: "A formula for a potion? No... he didn't talk to me about something like that."
  - words: ["rhyme"]
    action: say
    text: "He recitated it that often that I learned it by heart myself. I would recitate it, but I am not skilled in that kind of things."
  - words: ["kiss"]
    action: say
    text: "Well, some years ago, I would have asked you to talk with Lynda about this matter. However, since she became a priestess, she ... changed a lot."
  - words: ["talk"]
    action: say
    text: "Who he talked to? Hm... I'm not sure, there were a few people around. No girls or women though. Maybe just ask around for Eclesius."
  - words: ["sam"]
    action: say
    text: "A loud neighbour, I get a lot of complaints about him."
