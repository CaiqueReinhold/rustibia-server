keywords:
  - words: GREET
    action: engage
    text: "Nice to meet you, Mister {{ PLAYERNAME | capitalize }}! Looking for furniture? You've come to the right place!"
  - words: GOODBYE
    action: dismiss
    text: "You'll come back. They all do."
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye."
  - words: ["trade", "offers"]
    action: trade
    text: "Have a look. Most furniture comes in handy kits. Just use them in your house to assemble the furniture. Do you want to see only a certain type of furniture?"
  - words: ["the first dragon"]
    action: say
    text: "A thaian folklore tale."
  - words: ["marsh willow"]
    action: say
    text: "You can't get any better wood in this world. And it has got a nice smell to it, too. There is nothing nicer than a marsh willow campfire."
  - words: ["how are you"]
    action: say
    text: "Excellent! Never felt better in my life!"
  - words: ["merchants"]
    action: say
    text: "Now those people really talk business. There is a new era dawning."
  - words: ["rebellion"]
    action: say
    text: "Well - a few paranoid souls think that Venore wants to gain independence from Thais. Nothing more than rumours."
  - words: ["benjamin"]
    action: say
    text: "He's incredibly slow. Just your average postman, I guess."
  - words: ["watching"]
    action: say
    text: "Look! They are doing it again! And they are always smiling!"
  - words: ["eclesius"]
    action: say
    text: "Ecle- who? No... can't say I know him."
  - words: ["quentin"]
    action: say
    text: "That old monk has probably never left that overcrowded town here."
  - words: ["smiling"]
    action: say
    text: "Yes! Smiling! How a professional sales artist such as myself is supposed to work in such an atmosphere is beyond me!"
  - words: ["quality"]
    action: say
    text: "Our furniture is produced by the finest carpenters on the continent using the rare wood of the Venorean marsh willow!"
  - words: ["venore"]
    action: say
    text: "The place where it all happens. That town really rocks! Thais could learn a lot about interior decoration from Venore!"
  - words: ["castle"]
    action: say
    text: "I've said it a thousand times! That place needs a complete refurbishing!"
  - words: ["marvik"]
    action: say
    text: "Druids are obsessed with trees and the bane of any carpenter."
  - words: ["gregor"]
    action: say
    text: "Those knights know how to party. And after such parties there's always need for new furniture."
  - words: ["muriel"]
    action: say
    text: "The sorcerers guild could really need someone with taste to redecorate it."
  - words: ["creeps"]
    action: say
    text: "Yes! I can never figure out which is which. And they are always watching me!"
  - words: ["artist"]
    action: say
    text: "Yes! Selling is a form of art! The elaborate combination of rhetoric and acting which serves to create a sublime longing for the infinite, embodied by second class furniture."
  - words: ["thais"]
    action: say
    text: "Thais is obsessed with its past. Everybody here is so proud of their history. Bah! Thais might have a long history, but it has no idea when it comes to interior decoration."
  - words: ["tibia"]
    action: say
    text: "Tibia is a wonderful place full of business opportunities."
  - words: ["elane"]
    action: say
    text: "She's pretty, but I am the kind of man who enjoys a long and healthy life."
  - words: ["guild"]
    action: say
    text: "Now those people really talk business. There is a new era dawning."
  - words: ["power"]
    action: say
    text: "There are a few rumours about a rebellion, but that is all they are."
  - words: ["name"]
    action: say
    text: "My friends call me Gamon. My fans call me the incredible Gammy!"
  - words: ["time"]
    action: say
    text: "Any time's a good time to buy some furniture."
  - words: ["shop"]
    action: say
    text: "I am Thais's foremost furniture salesman. Are you interested in my offers?"
  - words: ["king"]
    action: say
    text: "His Royal Highness will start to appreciate the superior quality of our stock soon enough!"
  - words: ["gorn"]
    action: say
    text: "He sells stuff of inferior quality. Nothing compared to venores high quality goods."
  - words: ["bozo"]
    action: say
    text: "Bozo! Damn that clown! He keeps making fake orders. It isn't funny to deliver a wardrobe to an address that doesn't even exist, you know!"
  - words: ["job"]
    action: say
    text: "I am Thais's foremost furniture salesman. Are you interested in my offers?"
  - words: ["sam"]
    action: say
    text: "I heard rumours he has some special offers for customers who know to ask for the correct things."
  - words: ["rug"]
    action: say
    text: "Oh, silly me! Rugs are out of stock at the moment! But we expect a new shipment anytime. Just watch out for the next update!... Of our inventory I mean."
  - words: ["topsy"]
    action: say
    text: "Ah, those twins. Strange people they are. Oh, they are great to work with, of course. Excellent quality, competetive prices! But well... they give me the creeps!"
  - words: ["turvy"]
    action: say
    text: "Ah, those twins. Strange people they are. Oh, they are great to work with, of course. Excellent quality, competetive prices! But well... they give me the creeps!"
  - words: ["twins"]
    action: say
    text: "Ah, those twins. Strange people they are. Oh, they are great to work with, of course. Excellent quality, competetive prices! But well... they give me the creeps!"
