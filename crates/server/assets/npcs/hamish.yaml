keywords:
  - words: GREET
    action: engage
    text: "Hi there, fellow adventurer. What's your need? Say trade and we'll soon get you fixed up. Or ask me about potions, wands, or runes."
  - words: GOODBYE
    action: dismiss
    text: "Use your runes wisely!"
  - words: WALK_AWAY
    action: dismiss
    text: "Use your runes wisely!"
  - words: ["trade", "offers"]
    action: trade
    text: "Take your pick! Or maybe you want to look only at potions, wands or runes?"
  - words: ["name"]
    action: say
    text: "Hamish MacGuffin, at your disposal."
  - words: ["job"]
    action: say
    text: "I craft highly efficient runes, wands and potions - always handy when you're in a fight against monsters! Ask me for a trade to browse through my stock."
  - words: ["rookgaard"]
    action: say
    text: "Nope. Doesn't sound familiar."
  - words: ["coltrayne"]
    action: say
    text: "Never asked about his past. Seems it's a pretty gloomy one. But he's an excellent blacksmith and seems content enough with his work here."
  - words: ["inigo"]
    action: say
    text: "Inigo taught me a trick or two since I joined Mr Morris' little crowd. Quite a nice old chap who's seen much of the world and knows his way around here. You should definitely ask him if you need help."
  - words: ["garamond"]
    action: say
    text: "Can be quite feisty if you doubt his seniorship. <snorts> Knows a thing or two about spells, though. Useful knowledge."
  - words: ["wentworth"]
    action: say
    text: "Keeran? He's a bit like Plunderpurse's shadow, isn't he? Loves numbers, but I believe underneath it all he always wanted to break out of his boring little job in the city."
  - words: ["richard"]
    action: say
    text: "Seems good-natured enough a guy. Nimble with his hands, be it cooking or carpentering. Seems to want to keep his mind off something, so he's always busy fixing stuff or cooking something up."
  - words: ["mr morris"]
    action: say
    text: "If it wasn't for Mr Morris, maybe none of us would be alive. Or at least, none of us would be here. He's been everywhere and gathered some adventurers around him to investigate the secrets of Dawnport."
  - words: ["oressa"]
    action: say
    text: "Our druid, down in the temple. Just appeared out of the blue one day. Keeps to herself. She must have some reason to stay with us rather than roam the bigger Mainland. Well, we all have our reasons."
  - words: ["plunderpurse"]
    action: say
    text: "Now there's someone who has lived life to the full! Don't know though whether I should really believe that he's a clerk now."
  - words: ["ser tybald"]
    action: say
    text: "I wish I had thought of changing my name to that of a hero. Would have smoothed my way no end! Anyway, whatever he was before he joined, Tybald now fits the bill of the legendary hero. He even has a crush on lady Oressa. Cute. <chuckles>"
  - words: ["menesto"]
    action: say
    text: "Hah, I told him he should take a potion or two! But nooo, he's always so sure of himself. Huh. Well, you'd better tell Oressa to patch him up, then."
  - words: ["potions"]
    action: say
    text: "Of course, just browse through my wares. You can also look at wands or runes."
  - words: ["wands"]
    action: say
    text: "Of course, just browse through my wares. You can also look at potions or runes."
  - words: ["runes"]
    action: say
    text: "Of course, just browse through my wares. You can also look at potions or wands."
  - words: ["dawnport"]
    action: say
    text: "Small and deceptively friendly-looking island. Well, I used to study the plants and herbs here for my potions. Nowadays, I leave that to Oressa, she has a better way with that horrible wildlife here. I prefer to distil potions in the quiet of my lab. If you need some potions, runes or other magic equipment, ask for a trade."
  - words: ["main"]
    action: say
    text: "Dawnport is not far off from the coast of the Tibian Mainland. Lots of cities, monsters, bandits, brigands, mean folk and people of low understanding with no sense of respect towards alchemical genius. <mutters to himself> Ahem. Once you're level 8, you should be experienced enough to choose your definite vocation and leave Dawnport for Main - and Tibia definitely needs more skilled adventurers to keep those monsters in check which roam our lands!"
  - words: ["key"]
    action: say
    text: "I've seen Mr Morris leaving the key here and there on several occasions. He really should have put it somewhere safe."
