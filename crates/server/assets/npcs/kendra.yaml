name: Kendra
position: { x: 33494, y: 31057, z: 7 }
speed: 100
outfit:
  id: 155
  colors: [77, 0, 76, 132]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Passages to Thais
arguments:
  THAIS: { x: 32259, y: 32262, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["thais"]
    action: say
    text: Do you seek a passage to Thais for 180 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "180"
          position: THAIS
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["passenger"]
    action: say
    text: We would like to welcome you on board.
  - words: ["passage", "sail", "go"]
    action: say
    text: Where do you want to go? To Thais
  - words: ["ab'dendriel", "liberty bay", "ankrahmun", "roshamuul", "svargrond", "darashia", "krailos", "oramond", "yalahar", "carlin", "darama", "venore", "edron"]
    action: say
    text: I'm sorry, but I don't sail there.
  - words: ["vigintia"]
    action: say
    text: This lovely island is close to Nostalgia. There are a fair, beautiful beaches, some festive diversion and of course enough to eat and drink.
  - words: ["travora"]
    action: say
    text: Sorry, but I've never heard of this place.
  - words: ["ferry"]
    action: say
    text: I can sail you to the islands Vigintia and Nostalgia.
  - words: ["name"]
    action: say
    text: My name is Kendra.
  - words: ["ship"]
    action: say
    text: I'd rather call it a boat or a ferry, to be honest.
  - words: ["boat"]
    action: say
    text: It is a ferry. I can sail you to the islands Vigintia and Nostalgia.
  - words: ["kick"]
    action: say
    text: Off with you!
  - words: ["job"]
    action: say
    text: I run a ferry service between Thais and the islands Vigintia and Nostalgia.
