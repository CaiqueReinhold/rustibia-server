name: Kendra
position: { x: 32261, y: 32262, z: 7 }
speed: 100
outfit:
  id: 155
  colors: [77, 0, 76, 132]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Passages to Nostalgia
arguments:
  NOSTALGIA: { x: 33494, y: 31059, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["nostalgia"]
    action: say
    text: Do you seek a passage to Nostalgia for 180 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "180"
          position: NOSTALGIA
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["passenger"]
    action: say
    text: We would like to welcome you on board.
  - words: ["passage", "sail", "go"]
    action: say
    text: Where do you want to go? To Nostalgia, Horror Village
