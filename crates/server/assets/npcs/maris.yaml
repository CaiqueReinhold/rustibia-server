name: Maris
position: { x: 32648, y: 31292, z: 6 }
speed: 100
outfit:
  id: 151
  colors: [78, 51, 85, 126]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  FENROCK: { x: 32563, y: 31313, z: 7 }
  MISTROCK: { x: 32640, y: 31439, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: I hope you have a good reason to step near my ship, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Yeah, bye or whatever.
  - words: WALK_AWAY
    action: dismiss
    text: Bye.
  - words: ["fenrock"]
    action: say
    text: Do you want go to the Fenrock for 100 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "100"
          position: FENROCK
      - words: ["no"]
        action: say
        reset: true
        text: Alright then!
  - words: ["mistrock"]
    action: say
    text: Do you want go to the Mistrock for 100 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "100"
          position: MISTROCK
      - words: ["no"]
        action: say
        reset: true
        text: Alright then!
  - words: ["offer", "passage"]
    action: say
    text: I can take you to Fenrock and Mistrock!
  - words: ["job", "captain"]
    action: say
    text: I am Maris, Captain of this ship.
