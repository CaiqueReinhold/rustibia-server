name: Maris
position: { x: 32640, y: 31437, z: 7 }
speed: 100
outfit:
  id: 151
  colors: [78, 51, 85, 126]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  YALAHAR: { x: 32649, y: 31292, z: 6 }
  FENROCK: { x: 32563, y: 31313, z: 7 }
  KICK:
    - { x: 32634, y: 31437, z: 7 }
    - { x: 32634, y: 31438, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Oh, you're still alive. Hello, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Yeah, bye or whatever.
  - words: WALK_AWAY
    action: dismiss
    text: Bye.
  - words: ["yalahar"]
    action: say
    text: Do you want go back to Yalahar for 100 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "100"
          position: YALAHAR
      - words: ["no"]
        action: say
        reset: true
        text: Alright then!
  - words: ["fenrock"]
    action: say
    text: Do you want go to the Fenrock for 100 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "100"
          position: FENROCK
      - words: ["no"]
        action: say
        reset: true
        text: Alright then!
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 1)]
  - words: ["mistrock"]
    action: say
    text: Do you smell this? It's the smell of fire... the fire of a forge. Many people searched this rock here for a hidden path, but they haven't found anything. ... I'd search on Fenrock if I were you. Even though there's snow on the surface, it's still warm underground. There are often caves under fresh lava streams.
  - words: ["offer", "passage"]
    action: say
    text: I can take you to Yalahar or Fenrock!
  - words: ["job", "captain"]
    action: say
    text: I am Maris, Captain of this ship.
