name: Melian
position: { x: 32983, y: 31539, z: 1 }
speed: 100
outfit:
  id: 146
  colors: [97, 22, 45, 57]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATIONS:
    darashia: { name: Darashia on Darama, cost: 60, position: { x: 33270, y: 32441, z: 6 } }
    darama: { name: Darashia on Darama, cost: 60, position: { x: 33270, y: 32441, z: 6 } }
    svargrond: { name: Svargrond, cost: 60, position: { x: 32253, y: 31097, z: 4 } }
    femor hills: { name: the Femor Hills, cost: 60, position: { x: 32536, y: 31837, z: 4 } }
    hills: { name: the Femor Hills, cost: 60, position: { x: 32536, y: 31837, z: 4 } }
    edron: { name: Edron, cost: 60, position: { x: 33193, y: 31784, z: 3 } }
    kazordoon: { name: Kazordoon, cost: 70, position: { x: 32588, y: 31941, z: 0 } }
    kazor: { name: Kazordoon, cost: 70, position: { x: 32588, y: 31941, z: 0 } }
    issavi: { name: Issavi, cost: 100, position: { x: 33957, y: 31515, z: 0 } }
    marapur: { name: Marapur, cost: 70, position: { x: 33805, y: 32767, z: 2 } }
keywords:
  - words: GREET
    action: engage
    text: Greetings, traveller {{ PLAYERNAME | capitalize }}. Where do you want me to fly you?
  - words: GOODBYE
    action: dismiss
    text: Good bye!
  - words: WALK_AWAY
    action: dismiss
    text: Good bye!
  - words: ["darashia", "darama", "svargrond", "femor hills", "hills", "edron", "kazordoon", "kazor", "issavi", "marapur"]
    action: say
    text: Do you seek a ride to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
  - words: ["lizard"]
    action: say
    text: There are many of them to the north and south of this continent. I had thought they only existed on Tiquanda, but I was mistaken.
  - words: ["zao", "continent"]
    action: say
    text: What a strange and bizarre continent. I'm glad my landing place is far away from all the mess I've seen from above.
  - words: ["fly"]
    action: say
    text: I can fly you to Darashia, Edron, Issavi, Svargrond, Kazordoon, Femor Hills or to Marapur if you like. Where do you want to go?
  - words: ["service", "job"]
    action: say
    text: I'm a carpet pilot. I can fly you to the Femor Hills, to Kazordoon, Svargrond, Edron, Darashia, Issavi or Marapur.
  - words: ["name"]
    action: say
    text: Melian at your service.
  - words: ["mountain"]
    action: say
    text: These mountains don't look friendly. I prefer not staying long inbetween my carpet trips.
  - words: ["carpet"]
    action: say
    text: Only licensed carpet pilots are allowed to fly those.
  - words: ["orc"]
    action: say
    text: There's so much green stuff down there that I'm not sure whether there are any, but yes, might be, might be.
  - words: ["dwarf", "steamboat"]
    action: say
    text: Well, dwarves and their steamboat technology are well and good, but nothing beats flying on a carpet.
  - words: ["farmine"]
    action: say
    text: That's the name of that dwarven base as far as I know. Got a bit of a pessimistic ring to it if you ask me. Sounds to me like they're starving.
  - words: ["passage", "tibia", "ride", "trip", "transport"]
    action: say
    text: I can fly you to Darashia on Darama, to Kazordoon, to Svargrond on Hrodmir, to Edron, to the Femor Hills, to Issavi or to Marapur if you like. Where do you want to go?
  - words: ["human"]
    action: say
    text: The only humans I've seen on this continent are those that come up to my carpet.
  - words: ["femur"]
    action: say
    text: You are probably talking about the FEMOR hills.
  - words: ["time"]
    action: say
    text: It's 2:55 pm right now. I think I'm five minutes late in my schedule.
