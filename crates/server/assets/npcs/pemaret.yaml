keywords:
  - words: GREET
    action: engage
    text: Greetings, young man. Looking for a passage or some fish, {{ PLAYERNAME | capitalize }}?
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["edron"]
    action: say
    text: Do you seek a passage to Edron for 20 gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "20"
          position: EDRON
      - words: ["no"]
        action: say
        reset: true
        text: Maybe later.
  - words: ["eremo"]
    action: say
    text: Do you seek a passage to Eremo for free?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: EREMO
      - words: ["no"]
        action: say
        reset: true
        text: Maybe later.
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 2)]
  - words: ["job", "captain"]
    action: say
    text: I'm a fisherman and I take along people to Edron. You can also buy some fresh fish.
  - words: ["fish"]
    action: say
    text: My fish is of the finest quality you could find. Ask me for a trade to check for yourself.
  - words: ["cormaya"]
    action: say
    text: It's a lovely and peaceful isle. Did you already visit the nice sandy beach?
  - words: ["name"]
    action: say
    text: My name is Pemaret, the fisherman.
