name: Petros
position: { x: 33290, y: 32481, z: 6 }
speed: 100
outfit:
  id: 128
  colors: [79, 10, 127, 127]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  DESTINATIONS:
    venore: { name: Venore, cost: 180, position: { x: 32954, y: 32022, z: 6 } }
    port hope: { name: Port Hope, cost: 50, position: { x: 32527, y: 32784, z: 6 } }
    liberty bay: { name: Liberty Bay, cost: 140, position: { x: 32285, y: 32892, z: 6 } }
    ankrahmun: { name: Ankrahmun, cost: 150, position: { x: 33092, y: 32883, z: 6 } }
    yalahar: { name: Yalahar, cost: 210, position: { x: 32816, y: 31272, z: 6 } }
    gray island: { name: Gray Island, cost: 160, position: { x: 33196, y: 31984, z: 7 } }
    krailos: { name: Krailos, cost: 200, position: { x: 33493, y: 31712, z: 6 } }
    issavi: { name: Issavi, cost: 130, position: { x: 33902, y: 31462, z: 6 } }
  KICK:
    - { x: 33288, y: 32474, z: 6 }
    - { x: 33291, y: 32474, z: 6 }
    - { x: 33293, y: 32471, z: 6 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. Where can I sail you today?
  - words: GOODBYE
    action: dismiss
    text: Bye.
  - words: WALK_AWAY
    action: dismiss
    text: Bye
  - words: ["venore", "port hope", "liberty bay", "ankrahmun", "yalahar", "gray island", "krailos", "issavi"]
    action: say
    text: Do you seek a passage to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["kick"]
    action: teleport
    failed_text: Off with you!
    params:
      cost: "0"
      position: KICK[uniform(0, 2)]
  - words: ["sail"]
    action: say
    text: My boat is ready to bring you to Venore, Port Hope, Liberty Bay, Yalahar, Gray Island, Ankrahmun, Krailos or Issavi. Or to Travora - a place between the worlds.
  - words: ["job"]
    action: say
    text: I am the captain of this ship.
  - words: ["passage"]
    action: say
    text: Where do you want to go - Krailos, Venore, Port Hope, Liberty Bay, Ankrahmun, Yalahar or Gray Island?
  - words: ["darashia"]
    action: say
    text: That's where we are.
  - words: ["name"]
    action: say
    text: It's Petros.
