name: Pino
position: { x: 33193, y: 31782, z: 3 }
speed: 100
outfit:
  id: 128
  colors: [115, 0, 67, 114]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Feel the wind in your hair during one of my carpet rides!
arguments:
  DESTINATIONS:
    farmine: { name: Farmine, cost: 60, position: { x: 32983, y: 31539, z: 1 } }
    zao: { name: Farmine, cost: 60, position: { x: 32983, y: 31539, z: 1 } }
    darashia: { name: Darashia on Darama, cost: 40, position: { x: 33270, y: 32441, z: 6 } }
    darama: { name: Darashia on Darama, cost: 40, position: { x: 33270, y: 32441, z: 6 } }
    kazordoon: { name: Kazordoon, cost: 70, position: { x: 32588, y: 31941, z: 0 } }
    kazor: { name: Kazordoon, cost: 70, position: { x: 32588, y: 31941, z: 0 } }
    femor hills: { name: the Femor Hills, cost: 60, position: { x: 32536, y: 31837, z: 4 } }
    hills: { name: the Femor Hills, cost: 60, position: { x: 32536, y: 31837, z: 4 } }
    svargrond: { name: Svargrond, cost: 60, position: { x: 32253, y: 31097, z: 4 } }
    issavi: { name: Issavi, cost: 100, position: { x: 33957, y: 31515, z: 0 } }
    marapur: { name: Marapur, cost: 70, position: { x: 33805, y: 32767, z: 2 } }
keywords:
  - words: GREET
    action: engage
    text: Greetings, traveller {{ PLAYERNAME | capitalize }}. Where do you want me to fly you?
  - words: GOODBYE
    action: dismiss
    text: Good bye!
  - words: WALK_AWAY
    action: dismiss
    text: Good bye!
  - words: ["farmine", "zao", "darashia", "darama", "kazordoon", "kazor", "femor hills", "hills", "svargrond", "issavi", "marapur"]
    action: say
    text: Do you seek a ride to {{ DESTINATIONS[WORD].name }} for {{ DESTINATIONS[WORD].cost }} gold?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: DESTINATIONS[PARENT_KEYWORD].cost
          position: DESTINATIONS[PARENT_KEYWORD].position
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
  - words: ["fly"]
    action: say
    text: I can fly you to Darashia, Issavi, Svargrond, Kazordoon, Zao, Femor Hills or to Marapur if you like. Where do you want to go?
