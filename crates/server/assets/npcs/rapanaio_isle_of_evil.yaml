name: Rapanaio
position: { x: 32667, y: 31454, z: 6 }
speed: 100
outfit:
  id: 160
  colors: [0, 21, 20, 39]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Passage to Kazordoon.
arguments:
  DESTINATION: { x: 32699, y: 31993, z: 14 }
keywords:
  - words: GREET
    action: engage
    text: Welcome on board, {{ PLAYERNAME | capitalize }}. I can travel you to kazordoon.
  - words: GOODBYE
    action: dismiss
    text: Good bye. Recommend us if you were satisfied with our service.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye then.
  - words: ["kazordoon"]
    action: say
    text: Do you seek a passage to Kazordoon for free?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: DESTINATION
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
  - words: ["name"]
    action: say
    text: My name is Rapanaio from the Royal Tibia Line.
  - words: ["job"]
    action: say
    text: I am the captain of this sailing-ship.
