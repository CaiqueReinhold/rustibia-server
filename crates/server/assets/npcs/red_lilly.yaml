keywords:
  - words: GREET
    action: engage
    text: "Hello sweetie. If you need general equipment, stuff like that, let me know."
  - words: GOODBYE
    action: dismiss
    text: "Good bye sweetie."
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye sweetie."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares. Remember that if you buy vials of oil, there's a deposit of 5 gold on the empty one."
  - words: ["charlotta"]
    action: say
    text: "Just between you and me hun, that woman is a witch. Love potions, poison, voodoo dolls to torture your neighbour. You name it, she got it."
  - words: ["cult"]
    action: say
    text: "Uh! <whispers> There are ... rumours, you know? About bloody rituals and gruesome curses ... better don't talk aloud about such issues."
  - words: ["djinn"]
    action: say
    text: "Kshh!! No talks about ... the magic folk here ... This might draw their attention."
  - words: ["eleonore"]
    action: say
    text: "Hard to imagine that this fat man has such a pretty daughter."
  - words: ["ferumbras"]
    action: say
    text: "Don't mention HIM in my house you fool. You call evil and mayhem upon us."
  - words: ["food"]
    action: say
    text: "I am not dealing with food."
  - words: ["governor"]
    action: say
    text: "I won't say anything bad about such a high-born person. That's why I remain silent hun ."
  - words: ["job"]
    action: say
    text: "I run this little pawnshop, hun, but I think you knew that already."
  - words: ["king"]
    action: say
    text: "What interest could a king have in this little settlement? If a king cares about us, there must be something important behind all this."
  - words: ["liberty bay"]
    action: say
    text: "Liberty comes, liberty goes, only the bay stays. Hehe."
  - words: ["light"]
    action: say
    text: "I sell torches, candelabra, and oil."
  - words: ["loveless", "theodore"]
    action: say
    text: "That guy is a shrewd trader, sweetie. I bet even I could learn a thing or two from him."
  - words: ["offer", "buy", "goods", "sell", "equipment", "stuff", "ware"]
    action: say
    text: "I have shovels, picks, scythes, bags, ropes, backpacks, plates, scrolls, watches, some lightsources, and other stuff. Just ask me for a trade."
  - words: ["pirate"]
    action: say
    text: "Mostly, pirates are bad for business. But sometimes, they are good for business."
  - words: ["plantations"]
    action: say
    text: "Sadly the workers have hardly enough money to buy something to eat and to drink. That is bad also for my business."
  - words: ["quara"]
    action: say
    text: "The quara are the curse of the sea. Everybody that dares to enrage the sea spirits has to fear their vengeance. They come at night to kidnap people who forgot their lucky charms at home ... Sometimes those evil beings take the most naughty children to raise them as their own underwater."
  - words: ["rum"]
    action: say
    text: "Ah, there is little in the world that comes close to the taste of rum."
  - words: ["striker"]
    action: say
    text: "I heard there is a fine bounty on his head. Would be a shame though to lose such a handsome man to the executioner <winks>."
  - words: ["sugar"]
    action: say
    text: "Sugar lets the money flow. We depend heavily on it."
  - words: ["thais"]
    action: say
    text: "Thais might be a splendid town, but this is of no use to us here. The situation in our town gets worse with every ship full of foreigners that arrives here."
  - words: ["venore"]
    action: say
    text: "I heard Venore will soon acquire several trade monopolies that will grant them wealth for centuries."
  - words: ["voodoo"]
    action: say
    text: "Well, <lowers the voice to a whisper> there are several people around who know this or that about voodoo and not all of them are up to something good. Just buy some lucky charms from that old hag Charlotta to be on the safe side."
  - words: ["wyrmslicer"]
    action: say
    text: "A handsome man but a bit too stiff. I think no one has ever had a chance to see him smiling."
