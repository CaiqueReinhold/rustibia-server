name: Reed
position: { x: 32801, y: 31103, z: 7 }
speed: 100
outfit:
  id: 131
  colors: [58, 43, 38, 76]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  QUARTERS:
    cemetery: { x: 32799, y: 31103, z: 7 }
    magician: { x: 32804, y: 31103, z: 7 }
keywords:
  - words: GREET
    action: engage
    text: Greetings, {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Good bye, {{ PLAYERNAME | capitalize }}.
  - words: WALK_AWAY
    action: dismiss
    text: Good bye.
  - words: ["pass"]
    action: say
    text: You can pass either to the Cemetery Quarter or Magician Quarter. Which one will it be?
    children:
      - words: ["cemetery", "magician"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: QUARTERS[WORD]
