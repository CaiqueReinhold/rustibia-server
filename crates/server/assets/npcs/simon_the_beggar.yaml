name: "Simon The Beggar"
position: { x: 32186, y: 32471, z: 7 }
speed: 100
outfit:
  id: 153
  colors: [116, 123, 123, 40]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - "Alms! Alms for the poor!"
    - "Sir, Ma'am, have a gold coin to spare?"
    - "I need help! Please help me!"
shop:
  - { id: 3457, buy: 50 }
keywords:
