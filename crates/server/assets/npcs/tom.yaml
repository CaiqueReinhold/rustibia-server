keywords:
  - words: GREET
    action: engage
    text: "Hey there, {{ PLAYERNAME | capitalize }}. I'm Tom the tanner. If you have fresh corpses, leather, paws or other animal body parts, trade with me."
  - words: GOODBYE
    action: dismiss
    text: "Good hunting, son."
  - words: WALK_AWAY
    action: dismiss
    text: "D'oh?"
  - words: ["trade", "offers"]
    action: trade
    text: "Sure, check what I buy."
  - words: ["name"]
    action: say
    text: "My name is Tom the tanner."
  - words: ["merchant"]
    action: say
    text: "Dixi and Lee'Delle sell my leather clothes in their shops."
  - words: ["tanner"]
    action: say
    text: "That's my job. It can be dirty at times but it provides enough income for my living."
  - words: ["information"]
    action: say
    text: "Do I look like a tourist information centre? Go ask someone else."
  - words: ["help"]
    action: say
    text: "Help? I will give you a few gold coins if you have some fresh dead animals for me. Note the word fresh."
  - words: ["fresh"]
    action: say
    text: "Fresh means: shortly after their death."
  - words: ["how are you"]
    action: say
    text: "Much to do these days."
  - words: ["monster"]
    action: say
    text: "Good monsters to start with are rats. They live in the sewers under the village of Rookgaard."
  - words: ["dungeon"]
    action: say
    text: "Dungeons can be dangerous without proper equipment."
  - words: ["equipment"]
    action: say
    text: "You need at least a backpack, a rope, a shovel, a weapon, an armor and a shield."
  - words: ["time"]
    action: say
    text: "Sorry, I haven't been outside for a while, so I don't know."
  - words: ["troll"]
    action: say
    text: "Troll leather stinks. Can't use it."
  - words: ["orc"]
    action: say
    text: "I don't buy orcs. Their skin is too scratchy."
  - words: ["backpack", "rope"]
    action: say
    text: "Nope, sorry, don't sell that. Go see Al Dee or Lee'Delle."
  - words: ["armor", "shield"]
    action: say
    text: "Nope, sorry, don't sell that. Ask Dixi or Lee'Delle."
  - words: ["weapon"]
    action: say
    text: "Nope, sorry, don't sell that. Ask Obi or Lee'Delle."
  - words: ["corpse", "wares", "animal", "sell", "buy", "offer"]
    action: say
    text: "I'm buying fresh corpses of rats, rabbits and wolves. I don't buy half-decayed ones. If you have any for sale, trade with me."
  - words: ["al dee"]
    action: say
    text: "He's an apple polisher."
  - words: ["amber"]
    action: say
    text: "Now that's an interesting woman."
  - words: ["billy"]
    action: say
    text: "He's a better cook than his cousin Willie, actually."
  - words: ["willie"]
    action: say
    text: "I kinda like him. At least he says what he thinks."
  - words: ["tom"]
    action: say
    text: "Yep."
  - words: ["seymour"]
    action: say
    text: "He sticks his nose too much in books."
  - words: ["zirella"]
    action: say
    text: "My mother?? Did you meet my mother??"
  - words: ["santiago"]
    action: say
    text: "I don't have a problem with him."
  - words: ["paulie"]
    action: say
    text: "Typical pencil pusher."
  - words: ["oracle"]
    action: say
    text: "It's in the academy, just above Seymour. Go there once you are level 8 to leave this place."
  - words: ["obi"]
    action: say
    text: "He is such a hypocrite."
  - words: ["norma"]
    action: say
    text: "I like her beer."
  - words: ["dixi"]
    action: say
    text: "She buys my fine leather clothes."
  - words: ["loui"]
    action: say
    text: "I wonder what spectacular monsters he has found."
  - words: ["lee'delle"]
    action: say
    text: "Her nose is a little high in the air, I think. She never shakes my hand."
  - words: ["hyacinth"]
    action: say
    text: "I wonder if he's angry because his potion monopoly fell."
  - words: ["cipfried"]
    action: say
    text: "I'm not what you'd call a 'believer'."
  - words: ["dallheim", "zerbrus"]
    action: say
    text: "He's okay."
