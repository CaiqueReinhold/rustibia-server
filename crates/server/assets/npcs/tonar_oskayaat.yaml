name: Tonar
position: { x: 33068, y: 32917, z: 7 }
speed: 100
outfit:
  id: 146
  colors: [0, 66, 124, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - I don't feel safe here ... I hope we can return to Ankrahmun soon.
