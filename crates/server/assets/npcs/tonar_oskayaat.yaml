    action: say
    text: A passage to Ankrahmun? Shall we cast off?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "0"
          position: DESTINATION
      - words: ["no"]
        action: say
        reset: true
        text: We would like to serve you some time.
