keywords:
  - words: GREET
    action: engage
    text: "Hello, dear {{ PLAYERNAME | capitalize }}. How can I help you? If you need magical equipment such as runes or wands, just ask me for a trade."
  - words: GOODBYE
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}. Do come again!"
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}. Do come again!"
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["animate dead rune"]
    action: say
    text: "Sorry, but runes of this type can't be purchased here."
  - words: ["how are you"]
    action: say
    text: "I'm just wonderful - thank you for asking."
  - words: ["excalibug"]
    action: say
    text: "If you want to find out about excalibug you should ask the more sinister characters in Thais, not a respectable woman like myself!"
  - words: ["rebellion"]
    action: say
    text: "There is talk of a rebellion in Venore to gain independence from the Oppressor... I mean, King - of Thais. It can only help business."
  - words: ["benjamin"]
    action: say
    text: "Bless him, he stood, he fought, and then left his sanity on the battlefield."
  - words: ["eclesius"]
    action: say
    text: "I heard that he left the city because he couldn't bear the shame of being rejected as courtmage. But that's just a gossip."
  - words: ["dungeon"]
    action: say
    text: "Dungeons - dank cold places if you ask me. They lead to rusty armor, severe colds and death ... on the other hand you use a lot of runes there ... so just think about the treasures you'll surely find there."
  - words: ["monster"]
    action: say
    text: "Better buy and charge a lot of runes before facing any monster."
  - words: ["quentin"]
    action: say
    text: "I can't tell much about that old monk."
  - words: ["chester"]
    action: say
    text: "I've never seen him at all. I only heard he's kind of the townsguards' chief or some such."
  - words: ["venore"]
    action: say
    text: "A marvellous city! Modern! Prosperous! Thais could learn a thing or two from Venore."
  - words: ["carlin"]
    action: say
    text: "I went there on holiday once. Just goes to show that women are much better at running a place than men. King Tibianus could learn a thing or two from Queen Eloise."
  - words: ["spells"]
    action: say
    text: "You never know when you run out of mana. All the more reason to buy some good runes or potions."
  - words: ["partos"]
    action: say
    text: "I heard he was a thief. Good thing he was caught."
  - words: ["gossip"]
    action: say
    text: "I'm all ears."
  - words: ["rumour"]
    action: say
    text: "I'm all ears."
  - words: ["gregor"]
    action: say
    text: "Ah, Knights ... can't expect much from those guys."
  - words: ["marvik"]
    action: say
    text: "Who knows what the old man is up to in his hideout when no one is watching?"
  - words: ["muriel"]
    action: say
    text: "You should ask this guy Oswald about him ... or other pointless rumors."
  - words: ["sewer"]
    action: say
    text: "The Thais sewerage system is a model of modern rat breeding and for some reason is very popular with young adventurers such as yourself."
  - words: ["gamon"]
    action: say
    text: "I think he is a spy ... so I smile at him the whole day. He won't get anything out of me!"
  - words: ["magic"]
    action: say
    text: "Magic will only protect you - a rune and some magic potions."
  - words: ["power"]
    action: say
    text: "There is a power struggle between Venore and Thais."
  - words: ["elane"]
    action: say
    text: "Some call her the preying mantis - apparently she has killed over a dozen husbands already."
  - words: ["fluid"]
    action: say
    text: "Sorry, we removed the old life and mana fluids from our assortment. However, we offer health, spirit and mana potions in up to four sizes, just ask me for a trade."
  - words: ["gamel"]
    action: say
    text: "He hung around with that Partos a lot. I wouldn't be surprised if he's a thief too. He is not allowed to enter our markethall."
  - words: ["lugri"]
    action: say
    text: "I only heard rumours about him - isn't he a hermit somewhere in the north?"
  - words: ["boss"]
    action: say
    text: "I had one once. He should have bought better armor. Actually - he's upstairs."
  - words: ["king"]
    action: say
    text: "<mutters> Here we go again ... Hail to King Tibianus! ... Don't make me do that again!"
  - words: ["time"]
    action: say
    text: "Time waits for no one! Not even you, sweetheart, so please do hurry up."
  - words: ["name"]
    action: say
    text: "My name is Topsy."
  - words: ["bozo"]
    action: say
    text: "He wanted to be the court jester but got upset when people laughed at him."
  - words: ["gorn"]
    action: say
    text: "Ah yes ... Gorn ... the used-cart salesman of scrolls."
  - words: ["god"]
    action: say
    text: "Gods - if we didn't have them, we would have invented them."
  - words: ["new"]
    action: say
    text: "I'm all ears."
  - words: ["sam"]
    action: say
    text: "Ah, such a sweetie. A simple man, with simple tastes and a simple mind."
  - words: ["job"]
    action: say
    text: "I sell runes as well as spirit, health and mana potions - your best friends in any dungeon!"
