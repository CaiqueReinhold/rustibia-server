keywords:
  - words: GREET
    action: engage
    text: "Hello, dear {{ PLAYERNAME | capitalize }}. Can I be of any assistance? Just tell me if you'd like to trade weapons or armor."
  - words: GOODBYE
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}. Do come again!."
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}. Do come again!."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my offers."
  - words: ["ab'dendriel"]
    action: say
    text: "Aah... a beautiful leafy city. Shame about the elves."
  - words: ["how are you"]
    action: say
    text: "I'm just fine and dandy, thank you for asking."
  - words: ["assistant"]
    action: say
    text: "I am not a mere assistant! I have a job of great responsibility! But mostly I keep annoying personages away from my boss."
  - words: ["kazordoon"]
    action: say
    text: "You need to shrink before you go there - they say the dwarves aren't too keen on sharing their mountain with us Tibians."
  - words: ["rebellion"]
    action: say
    text: "Well, Venore is richer than Thais, and some people want to live in a democracy free from an oppressive tyrant - I mean monarch. I'm not one of them."
  - words: ["eclesius"]
    action: say
    text: "There's always some gossip on the street about him. I've never met him in person though. I guess he doesn't need many weapons."
  - words: ["annoying"]
    action: say
    text: "Oh gosh - I could tell you some stories. But I won't."
  - words: ["benjamin"]
    action: say
    text: "Ah, such a shame about poor Benjamin. Lost it a bit after receiving one too many blows to the head."
  - words: ["chester"]
    action: say
    text: "I have never heard any rumours concerning him, isn't that odd?"
  - words: ["rumours"]
    action: say
    text: "You know a rumour? Well then - don't keep it to yourself."
  - words: ["weapons"]
    action: say
    text: "The word on the street is that Sam does not forge all his weapons himself, but buys them from his cousin, who is married to a cyclops."
  - words: ["dungeon"]
    action: say
    text: "If you want to see dungeons go and insult the guards. On second thoughts - don't do that."
  - words: ["monster"]
    action: say
    text: "There is a monster here? HERE?! Time to double the prices!"
  - words: ["quentin"]
    action: say
    text: "You can't teach an old monk new tricks. He is stubborn to the extreme and overly concerned about Thais. He should care more about his gods and less about that king."
  - words: ["gossip"]
    action: say
    text: "You know a rumour? Well then - don't keep it to yourself."
  - words: ["venore"]
    action: say
    text: "Ah... Venore - a wonderful city! Full of culture! So many friendly faces! So unlike Thais!"
  - words: ["carlin"]
    action: say
    text: "Those women really know how to run things - look at how well the trade is going there!"
  - words: ["spells"]
    action: say
    text: "Spells - dodgy mumbo jumbo if you ask me. A sword never backfires on its user!"
  - words: ["partos"]
    action: say
    text: "Some thief they caught for all I know."
  - words: ["magic"]
    action: say
    text: "Magic is a thing of the past. Why bother with a colourful bit of rock and a few fancy words when you can have a foot of razor-sharp steel in your hand?!"
  - words: ["gamon"]
    action: say
    text: "Shhh! He's a spy! He watches us all the time! Just keep smiling and he'll go away!"
  - words: ["thais"]
    action: say
    text: "Thais is OK - I suppose. Not as nice as Venore, but good for business."
  - words: ["elves"]
    action: say
    text: "Elves are good with a bow and arrow, or so I am told. Shame that they are no good at peace-making."
  - words: ["sewer"]
    action: say
    text: "It is very effective, but attracts almost as many wannabe heroes as it does rats."
  - words: ["ardua"]
    action: say
    text: "Well - she isn't really my kind of person. Please don't mention her name again."
  - words: ["power"]
    action: say
    text: "There are people who talk about a rebellion against King Tibianus."
  - words: ["dwarf"]
    action: say
    text: "I don't know much about them - there are some civilised dwarves, of course, but I can never tell whether they are male or female."
  - words: ["elane"]
    action: say
    text: "A true tragedy - she has lost so many husbands in such unusual circumstances."
  - words: ["gamel"]
    action: say
    text: "Some sinister guy that is. He's not allowed to enter that markethall and that's for a good reason."
  - words: ["name"]
    action: say
    text: "Some call me Turvy. Actually, everybody calls me Turvy."
  - words: ["news"]
    action: say
    text: "You know a rumour? Well then - don't keep it to yourself."
  - words: ["king"]
    action: say
    text: "Ah, yes, yes, hail to King Tibianus! May he in his infinite wisdom reduce my taxes... and so on..."
  - words: ["time"]
    action: say
    text: "It is nearly time for my afternoon nap, so please hurry!"
  - words: ["bozo"]
    action: say
    text: "Bozo - such a tragic story. If only I could remember it."
  - words: ["gorn"]
    action: say
    text: "He does a good line in second-rate scrolls for first-rate prices."
  - words: ["job"]
    action: say
    text: "It is an absolute honour to provide weaponry and armor to the courageous adventurers of Thais, just so long as you have the gold to pay for it."
  - words: ["sam"]
    action: say
    text: "A simple shopkeeper, who was last in the queue when they were handing out intelligence."
  - words: ["god"]
    action: say
    text: "The Gods of Tibia play games with the fate of Tibians - but they haven't bothered to read the instructions."
