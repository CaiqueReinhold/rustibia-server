name: Urks The Mute
position: { x: 33517, y: 32856, z: 14 }
speed: 100
outfit:
  id: 66
  colors: [0, 0, 0, 0]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 0
arguments:
  KAZORDOON: { x: 32660, y: 31957, z: 15 }
  CORMAYA: { x: 33311, y: 31989, z: 15 }
keywords:
  - words: GREET
    action: engage
    text: Welcome, {{ PLAYERNAME | capitalize }}! Lovely steamboat, ain't it? I can even offer you a passage if you like.
  - words: GOODBYE
    action: dismiss
    text: Until next time.
  - words: WALK_AWAY
    action: dismiss
    text: Until next time.
  - words: ["kazordoon"]
    action: say
    text: <the dwarf smiles slightly, shows you a piece of paper with 200 gold written on it, as expecting a yes or no>
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "200"
          position: KAZORDOON
      - words: ["no"]
        action: say
        reset: true
        text: <the dwarf just shrugs>
  - words: ["cormaya"]
    action: say
    text: <the dwarf smiles slightly, shows you a piece of paper with 200 gold written on it, as expecting a yes or no>
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "200"
          position: CORMAYA
      - words: ["no"]
        action: say
        reset: true
        text: <the dwarf just shrugs>
  - words: ["passage"]
    action: say
    text: <the dwarf quizzically raises his brow - the only destinations he accepts seems to be Cormaya or Kazordoon>
