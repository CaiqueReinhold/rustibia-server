name: Uzon
position: { x: 32661, y: 31915, z: 0 }
speed: 100
outfit:
  id: 130
  colors: [95, 4, 17, 95]
walk_range: 2
talk_range: 3
say:
  cooldown: 300
  chance: 50000
  sentences:
    - Feel the wind in your hair during one of my carpet rides!
arguments:
  FEMOR_HILLS: { x: 32535, y: 31837, z: 4 }
keywords:
  - words: GREET
    action: engage
    text: Daraman's blessings, traveller {{ PLAYERNAME | capitalize }}.
  - words: GOODBYE
    action: dismiss
    text: Daraman's blessings
  - words: WALK_AWAY
    action: dismiss
    text: Daraman's blessings
  - words: ["passage"]
    action: say
    text: Can we finally leave this cursed place?
    children:
      - words: ["yes"]
        action: teleport
        failed_text: You don't have enough money.
        params:
          cost: "60"
          position: FEMOR_HILLS
      - words: ["no"]
        action: say
        reset: true
        text: You shouldn't miss the experience.
  - words: ["name"]
    action: say
    text: I am known as Uzon Ibn Kalith.
  - words: ["fly"]
    action: say
    text: I transport travellers to the continent of Darama for a small fee. So many want to see the wonders of the desert and learn the secrets of Darama.
  - words: ["new", "rumors"]
    action: say
    text: I heard too many news to recall them all.
  - words: ["time"]
    action: say
    text: It's 3:42 pm right now. The next flight is scheduled soon.
