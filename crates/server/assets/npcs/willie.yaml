    text: "Hiho {{ PLAYERNAME | capitalize }}. I hope you're here to trade."
  - words: GOODBYE
    action: dismiss
    text: "Yeah, bye {{ PLAYERNAME | capitalize }}."
  - words: WALK_AWAY
    action: dismiss
    text: "Yeah go away!"
