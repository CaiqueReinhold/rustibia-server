keywords:
  - words: GREET
    action: engage
    text: "Greetings, {{ PLAYERNAME | capitalize }}."
  - words: GOODBYE
    action: dismiss
    text: "Good bye, {{ PLAYERNAME | capitalize }}."
  - words: WALK_AWAY
    action: dismiss
    text: "Good bye."
  - words: ["trade", "offers"]
    action: trade
    text: "Of course, just browse through my wares."
  - words: ["cledwyn"]
    action: say
    text: "Yes, he's my cousin. He also collects rare tokens, but unlike me he's interested in silver tokens. Call this passion something of a family trait."
  - words: ["family"]
    action: say
    text: "You might find my cousin Cledwyn downstairs on the main floor. We're all interested in rare tokens, always on the move to offer our services in exchange for these treasures. ... There's a kind of a competition on who's the most successful token hunter. If you should have any gold tokens with you, we could make a deal."
  - words: ["name"]
    action: say
    text: "I'm Yana O'Reilly, bespoke smith and a token trader. It's a pleasure to meet you."
  - words: ["yana"]
    action: say
    text: "Yes, that's my name. My mother chose it, it means prudence or cunningness in some old and almost forgotten Tibian language."
  - words: ["job"]
    action: say
    text: "I'm collecting rare tokens made of metal or gemstones. At the moment, I'm interested in gold tokens. If you should happen to have some with you, I could exchange them for special weapons of different types."
