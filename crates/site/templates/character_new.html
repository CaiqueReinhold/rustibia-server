{% extends "base.html" %}
{% block title %}Create Character — Rustibia{% endblock %}
{% block content %}
<section class="auth">
  <div class="framed auth-card">
    <span class="corner corner-tl" aria-hidden="true"></span><span class="corner corner-tr" aria-hidden="true"></span><span class="corner corner-bl" aria-hidden="true"></span><span class="corner corner-br" aria-hidden="true"></span>
    <div class="auth-head">
      <a class="brand" href="/"><svg class="icon-gold" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><g transform="rotate(-45 16 16)"><path d="M18.6 3.2 A3.4 3.4 0 1 0 18.6 9.2 A2.6 2.6 0 1 1 18.6 3.2 Z"/><path d="M16 9.4 V28.5"/><path d="M14.6 11.6 H17.4"/></g><g transform="rotate(45 16 16)"><path d="M16 3 L17.6 6.2 V20 H14.4 V6.2 Z"/><path d="M11.5 20 H20.5"/><path d="M16 20 V25.5"/><circle cx="16" cy="27" r="1.4"/></g></svg><span>Rustibia</span></a>
      <h1>Create Character</h1>
      <p>Choose who you will be.</p>
    </div>
    {% if let Some(error) = error %}<p class="notice notice-error">{{ error }}</p>{% endif %}
    <form class="form" method="post" action="/account/characters/new">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name }}" required>
      </div>
      <div class="field">
        <label for="sex">Sex</label>
        <select id="sex" name="sex">
          {% for option in sexes %}
          <option value="{{ option.as_i16() }}">{{ option.name() }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="vocation">Vocation</label>
        <select id="vocation" name="vocation">
          {% for option in vocations %}
          <option value="{{ option.as_i16() }}">{{ option.name() }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Character</button>
    </form>
    <div class="auth-foot"><a href="/account">Back to your account</a></div>
  </div>
</section>
{% endblock %}
