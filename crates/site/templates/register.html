{% extends "base.html" %}
{% block title %}Create Account — Rustibia{% endblock %}
{% block content %}
<section class="auth">
  <div class="framed auth-card">
    <span class="corner corner-tl" aria-hidden="true"></span><span class="corner corner-tr" aria-hidden="true"></span><span class="corner corner-bl" aria-hidden="true"></span><span class="corner corner-br" aria-hidden="true"></span>
    <div class="auth-head">
      <svg class="shield" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16 3 L27 7 V15 C27 22 22 27 16 29 C10 27 5 22 5 15 V7 Z"/><path d="M16 9 V23"/><path d="M11.5 13.5 H20.5"/></svg>
      <h1>Create Account</h1>
      <p>Begin your journey in Rustibia.</p>
    </div>
    {% if let Some(error) = error %}<p class="notice notice-error">{{ error }}</p>{% endif %}
    <form class="form" method="post" action="/register">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password_confirm">Repeat Password</label>
        <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <div class="auth-foot">Already have an account? <a href="/login">Log in</a></div>
  </div>
</section>
{% endblock %}
