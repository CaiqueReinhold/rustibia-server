domain: rustibia.online
letsencrypt_email: caiquereinhold@gmail.com

ghcr_owner: caiquereinhold
ghcr_user: CaiqueReinhold
server_image: "ghcr.io/{{ ghcr_owner }}/rustibia-server"
site_image: "ghcr.io/{{ ghcr_owner }}/rustibia-site"
image_platform: linux/amd64

repo_root: "{{ playbook_dir }}/../.."
certs_dir: "{{ repo_root }}/deploy/certs"
app_dir: /opt/rustibia
app_uid: 10001

ssh_port: 22
game_port: 5555
telemetry_enabled: true

op_item: op://Rustibia/deploy
ghcr_push_token: "{{ lookup('pipe', 'op read ' ~ (op_item ~ '/ghcr_push_token') | quote) }}"
ghcr_pull_token: "{{ lookup('pipe', 'op read ' ~ (op_item ~ '/ghcr_pull_token') | quote) }}"
postgres_password: "{{ lookup('pipe', 'op read ' ~ (op_item ~ '/postgres_password') | quote) }}"

git_sha: "{{ lookup('pipe', 'git -C ' ~ repo_root ~ ' rev-parse --short=12 HEAD') }}"
git_dirty: "{{ lookup('pipe', 'git -C ' ~ repo_root ~ ' status --porcelain') | length > 0 }}"
image_tag: "{{ git_sha }}{{ '-dirty' if git_dirty else '' }}"
